name: iOS build and TestFlight

# Deliberately manual: no schedule, push, or pull_request notification spam.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify native build, capture simulator screenshots, or upload to TestFlight
        required: true
        type: choice
        default: verify
        options: [verify, screenshots, testflight]
      version:
        description: App Store version (must match the app's version record)
        required: true
        default: "1.0"
        type: string
      build_number:
        description: Optional positive integer; must exceed previous uploaded builds
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # The default branch carries this dispatch entry point, but release sources
    # and signing access are deliberately confined to the reviewed release ref.
    if: github.ref == 'refs/heads/codex/arcelira-ios-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Install Chromium for the SPA smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify credential-free Capacitor web entry
        run: npm run test:capacitor:web

  verify:
    if: inputs.mode == 'verify'
    needs: checks
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Select Xcode 26 SDK
        run: bash scripts/select-ios-xcode.sh
      - run: npm ci
      - name: Build and sync iOS web assets
        run: npm run cap:sync:ios
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
      - name: Compile the native app without signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/ios/simulator-build.log
      - name: Save simulator build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-diagnostics-${{ github.run_number }}
          path: build/ios/simulator-build.log
          retention-days: 7
      - name: Save simulator app (not installable on an iPhone)
        uses: actions/upload-artifact@v6
        with:
          name: Arcelira-simulator-${{ github.run_number }}
          path: build/ios/DerivedData/Build/Products/Release-iphonesimulator/App.app
          retention-days: 7

  screenshots:
    if: inputs.mode == 'screenshots'
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Product equality is checked against the approved build 5 commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Select Xcode 26 SDK
        run: bash scripts/select-ios-xcode.sh
      - run: npm ci
      - name: Build the credential-free guest edition of build 5
        run: npm run cap:sync:ios
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ""
          VITE_NEON_DATA_API_URL: ""
      # Only an ephemeral test target is generated; no signing/upload is used.
      - name: Capture real iPhone and iPad simulator screenshots
        run: bash scripts/ios-screenshots/capture.sh
      - name: Save screenshots and native UI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Arcelira-store-screenshots-${{ github.run_number }}
          path: |
            build/ios/screenshots/*-attachments/
            build/ios/screenshots/*.log
            build/ios/screenshots/provenance.json
          retention-days: 7
          if-no-files-found: warn

  testflight:
    if: inputs.mode == 'testflight'
    needs: checks
    environment: ios-testflight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_VERSION: ${{ inputs.version }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check signing secrets before building
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APPSTORE_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing ios-testflight secret: $name"
              missing=1
            fi
          done
          [[ "$missing" == 0 ]]
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Select Xcode 26 SDK
        run: bash scripts/select-ios-xcode.sh
      - run: npm ci
      - name: Build and sync iOS web assets
        run: npm run cap:sync:ios
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
      - name: Sign and upload to TestFlight (does not submit for App Review)
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash scripts/ios-testflight.sh
      - name: Save only the distributable IPA
        uses: actions/upload-artifact@v6
        with:
          name: Arcelira-ipa-${{ github.run_number }}
          path: build/ios/export/*.ipa
          retention-days: 7
